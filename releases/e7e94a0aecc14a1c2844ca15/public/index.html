<title>&#9673;</title><link rel="icon" type="image/svg+xml" href="/releases/e7e94a0aecc14a1c2844ca15/favicon.svg"><link rel="stylesheet" href="/releases/e7e94a0aecc14a1c2844ca15/style.css"><link rel="stylesheet" href="/releases/e7e94a0aecc14a1c2844ca15/tactics.css"><style>
#loading-screen{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#18383d 0%,#09171d 65%);color:#eee9d9;font-family:system-ui,sans-serif;opacity:1;transition:opacity .45s ease;touch-action:none}
#loading-screen.leaving{opacity:0}.loading-content{width:min(340px,calc(100vw - 64px));text-align:center}.loading-emblem{width:76px;height:76px;color:#e6b85b;margin-bottom:28px;filter:drop-shadow(0 0 22px #e6b85b25)}#loading-title{font-size:22px;font-weight:500;letter-spacing:.02em;margin:0 0 28px}#loading-progress{display:block;width:100%;height:5px;border:0;border-radius:10px;overflow:hidden;background:#ffffff16;accent-color:#e6b85b}#loading-progress::-webkit-progress-bar{background:#ffffff16}#loading-progress::-webkit-progress-value{background:#e6b85b;transition:width .2s}#loading-progress::-moz-progress-bar{background:#e6b85b}.loading-meta{display:flex;justify-content:space-between;gap:12px;margin-top:14px;font-size:12px;color:#a1b6b7}#loading-percent{font-variant-numeric:tabular-nums;color:#e6b85b}#loading-retry{margin:24px auto 0;padding:12px 24px;border:1px solid #e6b85b;border-radius:6px;background:transparent;color:#e6b85b;font:inherit;cursor:pointer}#loading-retry[hidden]{display:none}@media(prefers-reduced-motion:reduce){#loading-screen,#loading-progress::-webkit-progress-value{transition:none}}
</style></head>
<body aria-busy="true">
 <section id="loading-screen" aria-label="Game loading">
  <div class="loading-content">
   <svg class="loading-emblem" viewBox="0 0 60 60" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="30" cy="30" r="23"/><ellipse cx="30" cy="30" rx="11" ry="23"/><path d="M7 30h46M11 17h38M11 43h38"/></svg>
   <h1 id="loading-title" role="status">Downloading game…</h1>
   <progress id="loading-progress" max="100" value="0" aria-label="Estimated game download progress"></progress>
   <div class="loading-meta"><span id="loading-detail">Estimating time remaining…</span><span id="loading-percent">0%</span></div>
   <button id="loading-retry" hidden>Try again</button>
   <noscript><p>Enable JavaScript to load the game.</p></noscript>
  </div>
 </section>
 <div id="stars" aria-hidden="true"></div><div class="aura" aria-hidden="true"></div>
 <canvas id="globe" aria-label="Interactive globe. Drag to rotate, scroll or pinch to zoom, select a unit, choose the movement action, then tap a destination."></canvas>
 <div id="markers"></div>
 <header id="topbar"><div class="sigil" data-help="globe" aria-label="Meridian"><svg viewBox="0 0 60 60" fill="none" stroke="currentColor"><circle cx="30" cy="30" r="19"/><ellipse cx="30" cy="30" rx="9" ry="19"/><path d="M11 30h38M30 2v12M30 46v12M2 30h12M46 30h12"/><circle cx="30" cy="30" r="26" stroke-dasharray="1 5"/></svg></div><div id="resources"></div><div id="clock"></div><div id="connection" aria-label="Connection status"></div></header>
 <main id="lobby" class="panel"><div class="lobby-emblem" id="emblem"></div><div class="rule-line"><i></i><span id="era"></span><i></i></div><div id="civilizations" class="civilizations"></div><div id="bonus" class="bonus"></div><div class="divider"></div><div id="seats" class="seats"></div><div id="config" class="config"></div><div class="divider"></div><div id="victory-hint" class="victory-hint"></div><div class="launch-row"><button id="invite" class="secondary" aria-label="Create lobby and copy invitation link"></button><button id="start" class="primary" aria-label="Start match"></button></div><div id="seed" class="seed"></div></main>
 <aside id="roster" class="hidden"></aside><nav id="tools"></nav>
 <section id="province" class="panel hidden" aria-label="Selected tile, unit or city details"></section>
 <section id="research" class="panel hidden" aria-label="Technology tree"></section>
 <section id="guide" class="panel hidden" aria-label="Icon manual"></section>
 <dialog id="ending" class="panel" aria-labelledby="victory-title"></dialog>
 <div id="toast" role="status"></div><div id="march-hint" class="hidden"></div>
 <footer id="dock"></footer>
 <script type="module" data-game-boot src="/releases/e7e94a0aecc14a1c2844ca15/loading.js"></script>
</body></html>
