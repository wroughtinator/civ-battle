<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Forge</title>
<style>body{margin:0;background:#171a1c;color:#ddd;font:15px system-ui}main{max-width:1000px;margin:40px auto;padding:20px}h1{font-size:26px}section{display:flex;gap:32px;flex-wrap:wrap}img{width:min(512px,90vw);image-rendering:pixelated;background:repeating-conic-gradient(#24292b 0 25%,#202527 0 50%) 0/24px 24px;border-radius:12px;touch-action:none;cursor:grab}aside{width:300px}label{display:block;margin:24px 0}input,select,button{width:100%;margin-top:8px;accent-color:#e3b578}button,select{padding:10px;background:#292f32;color:#eee;border:1px solid #566065;border-radius:6px}code{overflow-wrap:anywhere}p{line-height:1.6;color:#adb8bc}#error{color:#ff9999}</style>
<main><h1>Asset Forge <small style="color:#e3b578;font-size:13px"> / texture workshop</small></h1><section><img id="frame" alt="Interactive model preview"><aside><h2 id="name"></h2><p>Drag to orbit. Edit the model JSON to reshape parts or author animation keys; changes appear on the next frame.</p><label>Yaw <output id="yv"></output><input id="yaw" type="range" min="-180" max="180" value="35"></label><label>Pitch <output id="pv"></output><input id="pitch" type="range" min="-80" max="80" value="15"></label><label>Animation<select id="clip"><option value="0">Rest pose</option></select></label><button id="play">Play animation</button><p id="stats"></p><p id="error"></p><p>Capture this angle with:<br><code id="cmd"></code></p></aside></section></main>
<script>
const $=id=>document.getElementById(id);let playing=false,t=0,last=performance.now(),drag=null,url;
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause animation':'Play animation'};
$('clip').onchange=()=>{t=0};$('frame').onpointerdown=e=>{drag=[e.clientX,e.clientY,+$('yaw').value,+$('pitch').value];$('frame').setPointerCapture(e.pointerId)};
$('frame').onpointerup=()=>drag=null;$('frame').onpointermove=e=>{if(drag){$('yaw').value=drag[2]+(e.clientX-drag[0])*.5;$('pitch').value=drag[3]+(e.clientY-drag[1])*.5}};
fetch('/model').then(r=>r.json()).then(m=>{$('name').textContent=m.name;$('stats').textContent=`${m.parts.reduce((n,p)=>n+(p.shape==='cylinder'?4*p.segments:12),0)} triangles · ${m.texture_size} × ${m.texture_size} texture · ${m.animations.length} clips`;m.animations.forEach((c,i)=>{const o=new Option(c.name,i+1);$('clip').add(o)})});
async function frame(){const now=performance.now();if(playing)t+=(now-last)/1000;last=now;const yaw=$('yaw').value,pitch=$('pitch').value;$('yv').value=yaw+'°';$('pv').value=pitch+'°';$('cmd').textContent=`asset-forge render MODEL.json output/pass --yaw ${yaw} --pitch ${pitch}`;try{const r=await fetch(`/frame?yaw=${yaw}&pitch=${pitch}&clip=${$('clip').value}&time=${t}`);if(!r.ok)throw Error(await r.text());const next=URL.createObjectURL(await r.blob());$('frame').src=next;if(url)URL.revokeObjectURL(url);url=next;$('error').textContent=''}catch(e){$('error').textContent=e.message}setTimeout(frame,50)}frame();
</script></html>
